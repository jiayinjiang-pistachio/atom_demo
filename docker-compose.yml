name: atom-demo

services:
  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: atom
      MYSQL_USER: atom
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-atom}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: UTC
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: mysql+asyncmy://atom:${MYSQL_PASSWORD:-atom}@mysql:3306/atom?charset=utf8mb4
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      PREVIEW_ORIGIN: ${PREVIEW_ORIGIN:-http://preview.localhost}
      PREVIEW_HOST: ${PREVIEW_HOST:-preview.localhost}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_MODE: ${LLM_MODE:-auto}
      MAX_RUNS_PER_GUEST_DAY: ${MAX_RUNS_PER_GUEST_DAY:-20}
      MAX_STEPS: ${MAX_STEPS:-24}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-32768}
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_PREVIEW_ORIGIN: ${PREVIEW_ORIGIN:-http://preview.localhost}
    depends_on:
      - api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2
    command:
      - caddy
      - run
      - --config
      - /etc/caddy/Caddyfile
      - --adapter
      - caddyfile
      # Watch the mounted config so route updates (e.g. /share-preview/*)
      # apply without recreating the container.
      - --watch
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      PREVIEW_DOMAIN: ${PREVIEW_DOMAIN:-preview.localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      # Mount the whole directory, not the single file: `git pull` replaces
      # Caddyfile with a new inode, and a file bind mount would keep serving
      # the old content even after `caddy reload`.
      - ./deploy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
